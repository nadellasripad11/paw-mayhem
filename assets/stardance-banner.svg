<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" font-family="'Segoe UI', Verdana, sans-serif">
  <!-- PAW MAYHEM — original Stardance banner concept. No copyrighted content. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb6ff"/>
      <stop offset="0.55" stop-color="#4a74d6"/>
      <stop offset="1" stop-color="#1b2340"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b98cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b98cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd86c"/><stop offset="1" stop-color="#5fae5c"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0ad"/><stop offset="1" stop-color="#5c6270"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff67e6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff67e6"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="600" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="240" cy="120" rx="90" ry="34"/><ellipse cx="300" cy="130" rx="70" ry="28"/>
    <ellipse cx="1320" cy="90" rx="110" ry="38"/><ellipse cx="1390" cy="104" rx="80" ry="30"/>
  </g>

  <!-- floating islands -->
  <g>
    <!-- left island -->
    <g transform="translate(210,430)">
      <path d="M-150,0 Q-150,-40 0,-40 Q150,-40 150,0 Z" fill="url(#grass)"/>
      <path d="M-120,0 Q0,140 120,0 Z" fill="url(#stone)"/>
      <path d="M150,-6 q40,120 -6,190" fill="none" stroke="#bfeaff" stroke-width="10" opacity="0.7"/>
    </g>
    <!-- right island -->
    <g transform="translate(1380,470)">
      <path d="M-170,0 Q-170,-46 0,-46 Q170,-46 170,0 Z" fill="url(#grass)"/>
      <path d="M-130,0 Q0,150 130,0 Z" fill="url(#stone)"/>
    </g>
    <!-- center small island -->
    <g transform="translate(800,520)">
      <path d="M-120,0 Q-120,-32 0,-32 Q120,-32 120,0 Z" fill="url(#grass)"/>
      <path d="M-90,0 Q0,100 90,0 Z" fill="url(#stone)"/>
    </g>
  </g>

  <!-- knockback motion lines -->
  <g stroke-linecap="round" opacity="0.9">
    <line x1="470" y1="300" x2="760" y2="300" stroke="url(#bolt)" stroke-width="10"/>
    <line x1="500" y1="330" x2="720" y2="330" stroke="url(#bolt)" stroke-width="6" opacity="0.6"/>
  </g>

  <!-- LEFT cat: shooter holding a blaster -->
  <g transform="translate(300,330)">
    <ellipse cx="0" cy="150" rx="70" ry="18" fill="#000" opacity="0.18"/>
    <!-- body -->
    <circle cx="0" cy="70" r="66" fill="#f0965a"/>
    <circle cx="0" cy="86" r="40" fill="#ffd0a0"/>
    <!-- head -->
    <circle cx="0" cy="-8" r="60" fill="#f0965a"/>
    <!-- ears -->
    <path d="M-46,-46 L-30,-92 L-8,-52 Z" fill="#f0965a"/>
    <path d="M46,-46 L30,-92 L8,-52 Z" fill="#f0965a"/>
    <path d="M-38,-52 l8,-26 l12,20 Z" fill="#ffd0a0"/>
    <path d="M38,-52 l-8,-26 l-12,20 Z" fill="#ffd0a0"/>
    <!-- eyes -->
    <ellipse cx="-22" cy="-8" rx="13" ry="16" fill="#2a2436"/>
    <ellipse cx="22" cy="-8" rx="13" ry="16" fill="#2a2436"/>
    <circle cx="-18" cy="-13" r="4" fill="#fff"/><circle cx="26" cy="-13" r="4" fill="#fff"/>
    <!-- nose + smile -->
    <ellipse cx="0" cy="16" rx="6" ry="4" fill="#ff8fb0"/>
    <path d="M-14,24 Q0,36 14,24" fill="none" stroke="#2a2436" stroke-width="3"/>
    <!-- blaster -->
    <g transform="translate(58,60) rotate(-8)">
      <rect x="0" y="-14" width="120" height="34" rx="14" fill="#8a5cff"/>
      <rect x="96" y="-20" width="40" height="46" rx="16" fill="#5fd0ff"/>
      <circle cx="140" cy="3" r="18" fill="url(#glow)"/>
    </g>
  </g>

  <!-- RIGHT cat: launched (knocked back), tumbling -->
  <g transform="translate(1180,250) rotate(24)">
    <circle cx="0" cy="40" r="52" fill="#8fb4f0"/>
    <circle cx="0" cy="-20" r="46" fill="#8fb4f0"/>
    <path d="M-36,-52 L-24,-88 L-6,-56 Z" fill="#8fb4f0"/>
    <path d="M36,-52 L24,-88 L6,-56 Z" fill="#8fb4f0"/>
    <!-- dizzy eyes -->
    <path d="M-26,-24 l16,16 M-10,-24 l-16,16" stroke="#2a2436" stroke-width="4" stroke-linecap="round"/>
    <path d="M10,-24 l16,16 M26,-24 l-16,16" stroke="#2a2436" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10,4 Q0,-6 10,4" fill="none" stroke="#2a2436" stroke-width="3"/>
    <!-- impact star -->
    <g transform="translate(-70,-40)" fill="#ffde59" opacity="0.95">
      <path d="M0,-26 L7,-7 L27,-7 L11,5 L17,25 L0,13 L-17,25 L-11,5 L-27,-7 L-7,-7 Z"/>
    </g>
  </g>

  <!-- title -->
  <g text-anchor="middle">
    <text x="800" y="250" font-size="132" font-weight="900" fill="url(#title)" stroke="#3a2a10" stroke-width="6" paint-order="stroke" letter-spacing="4">PAW MAYHEM</text>
    <text x="800" y="315" font-size="34" font-weight="700" fill="#eaf1ff" letter-spacing="8">SMALL CATS · BIG KNOCKBACK · ENDLESS FUN</text>
  </g>

  <!-- little pips -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="120" cy="70" r="3"/><circle cx="1500" cy="200" r="3"/><circle cx="900" cy="60" r="2.5"/><circle cx="700" cy="120" r="2.5"/>
  </g>
</svg>
